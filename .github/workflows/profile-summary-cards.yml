name: Profile summary cards

on:
  schedule:
    # Taeglich 04:17 UTC. Bewusst nicht "* */24 * * *" (wie im Action-README) --
    # das feuert 60x innerhalb einer Stunde statt einmal am Tag.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate summary cards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Klassischer PAT mit read:user + repo. Der eingebaute GITHUB_TOKEN
          # kommt nicht an die repo-uebergreifenden Contribution-Daten.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 1
          AUTO_PUSH: true
          # THEME leer = alle Themes. Das README nutzt "github" und "github_dark"
          # fuer die hell/dunkel-Umschaltung, daher werden beide gebraucht.
          THEME: ""
